# Runs tests and type checks on every push and pull request.
# Uses GitHub-hosted runners: free for public repos; private repos draw from the
# account's monthly included Actions allowance (see docs/DEPLOYMENT.md).
# It does not deploy anything; Render deploys main by itself.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

  # D1: the API's database tests (migrations, backfill, RLS, rollback, API
  # services) against PostgreSQL 17, the version Supabase runs in production.
  # The default `test` job runs the same tests on in-memory PGlite (Postgres 18).
  api-postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates (and drops) its own database on this server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Server version
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -tAc 'select version()'

      - name: API tests on PostgreSQL 17
        run: pnpm build:shared && pnpm --filter @travel-companion/api test
